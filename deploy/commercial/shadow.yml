services:
  tenant_memory:
    environment:
      KNOWLEDGE_DB_URL: ${KNOWLEDGE_DB_URL:-}
      KNOWLEDGE_DB_ADMIN_URL: ${KNOWLEDGE_DB_ADMIN_URL:-}
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      OLLAMA_BASE_URL: ${KNOWLEDGE_OLLAMA_URL:-http://ollama:11434}
  admin:
    environment:
      AUTUMN_SYNC_ENABLED: 'false'
  billing:
    environment:
      AUTUMN_SYNC_ENABLED: 'false'
      # Billing startup reflects tables while other connections are held.
      DB_POOL_SIZE: '2'
      DB_MAX_OVERFLOW: '1'
  agent-orchestrator:
    environment:
      PLATFORM_USAGE_ENABLED: 'true'
      AUTUMN_SYNC_ENABLED: 'false'
