services:
  iot:
    networks:
      - default
      - home-gateway
    environment:
      HOME_DOME_LOCAL_GATEWAY_ENABLED: 'true'
      HOME_DOME_POLL_ENABLED: 'true'
      DB_POOL_SIZE: '1'
      DB_MAX_OVERFLOW: '1'
  portal-builder:
    # One worker prevents slow cold starts from accumulating multiprocessing children.
    command: sh -c "uvicorn services.portal_builder.main:app --host 0.0.0.0 --port 8026 --workers 1 --no-access-log"
    environment:
      DB_POOL_SIZE: '1'
      DB_MAX_OVERFLOW: '1'
  tenant_memory:
    environment:
      KNOWLEDGE_DB_URL: ${KNOWLEDGE_DB_URL:-}
      KNOWLEDGE_DB_ADMIN_URL: ${KNOWLEDGE_DB_ADMIN_URL:-}
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      OLLAMA_BASE_URL: ${KNOWLEDGE_OLLAMA_URL:-http://ollama:11434}
  admin:
    environment:
      AUTUMN_SYNC_ENABLED: 'false'
  billing:
    environment:
      AUTUMN_SYNC_ENABLED: 'false'
      # Billing startup reflects tables while other connections are held.
      DB_POOL_SIZE: '2'
      DB_MAX_OVERFLOW: '1'
  agent-orchestrator:
    environment:
      PLATFORM_USAGE_ENABLED: 'true'
      AUTUMN_SYNC_ENABLED: 'false'
networks:
  home-gateway:
    external: true
    name: omnidome-home-gateway
