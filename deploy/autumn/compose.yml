name: omnidome-autumn
x-runtime: &runtime
  image: omnidome-autumn:89b5b6dc
  restart: unless-stopped
  mem_limit: 768m
  environment: &env
    NODE_ENV: production
    SERVER_FORK_COUNT: '1'
    WORKER_PROCESSES: '1'
    DATABASE_URL: postgres://autumn:${AUTUMN_DB_PASSWORD:?required}@postgres:5432/autumn
    DATABASE_CRITICAL_URL: postgres://autumn:${AUTUMN_DB_PASSWORD:?required}@postgres:5432/autumn
    REDIS_URL: redis://cache:6379
    MISC_CACHE_DRAGONFLY_PUBLIC_URL: redis://cache:6379
    CACHE_V2_DRAGONFLY_URL: redis://cache:6379
    CACHE_V2_DRAGONFLY_PUBLIC_URL: redis://cache:6379
    AUTUMN_API_URL: http://autumn:8080
    AUTUMN_PUBLIC_API_URL: http://localhost:8188
    CLIENT_URL: http://localhost:3000
    ENCRYPTION_PASSWORD: ${AUTUMN_ENCRYPTION_PASSWORD:?required}
    ENCRYPTION_IV: ${AUTUMN_ENCRYPTION_IV:?required}
    BETTER_AUTH_SECRET: ${AUTUMN_AUTH_SECRET:?required}
    OMNIDOME_BRIDGE_KEY: ${AUTUMN_BRIDGE_KEY:?required}
    KAFKA_BROKERS: kafka:9092
    KAFKA_AUTH_MODE: none
    BALANCE_WORKER_DEPLOYMENT: omnidome
    BALANCE_WORKER_PARTITION_COUNT: '4'
    BALANCE_WORKER_CATALOG_INVALIDATION_TOPIC: omnidome-catalog-invalidations-v1
    BALANCE_WORKER_TRANSPORT: direct
    BALANCE_WORKER_SQLITE_PATH: /app/apps/balance-worker/.state/balance.sqlite
    BALANCE_WORKER_CHECKPOINT_MODE: 'off'
    DYNAMODB_ENDPOINT: http://dynamodb:8000
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    AWS_REGION: us-east-1
    SQS_QUEUE_URL: http://queue:9324/000000000000/autumn.fifo
    SQS_QUEUE_URL_V2: http://queue:9324/000000000000/autumn.fifo
    TRACK_SQS_QUEUE_URL: http://queue:9324/000000000000/autumn-track.fifo
    TRACK_ASYNC_SQS_QUEUE_URL: http://queue:9324/000000000000/autumn-track.fifo
    TRACK_ASYNC_STANDARD_SQS_QUEUE_URL: http://queue:9324/000000000000/autumn-track-async
    STRIPE_WEBHOOK_SQS_QUEUE_URL: http://queue:9324/000000000000/autumn-stripe-webhook.fifo
services:
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autumn
      POSTGRES_DB: autumn
      POSTGRES_PASSWORD: ${AUTUMN_DB_PASSWORD:?required}
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U autumn -d autumn]
      interval: 5s
      timeout: 3s
      retries: 30
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.36.0
    restart: unless-stopped
    command: [--proactor_threads=1, --maxmemory=256mb]
    volumes: [cache:/data]
    ulimits:
      memlock: -1
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    mem_limit: 640m
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx384m -Xms128m
    volumes: [kafka:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 10s
      retries: 30
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    restart: unless-stopped
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
    command: [-jar, DynamoDBLocal.jar, -sharedDb, -dbPath, /home/dynamodblocal/data]
    volumes: [dynamodb:/home/dynamodblocal/data]
  queue:
    image: softwaremill/elasticmq-native:1.6.14
    restart: unless-stopped
    volumes: [./elasticmq.conf:/opt/elasticmq.conf:ro]
  autumn:
    <<: *runtime
    ports: [127.0.0.1:8188:8080]
    networks: [default, core]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      cache: {condition: service_started}
      dynamodb: {condition: service_started}
      queue: {condition: service_started}
  balances:
    <<: *runtime
    # Upstream accepts only loopback for the direct transport listener.
    network_mode: service:autumn
    command: [bun, --cwd=../apps/balance-worker, --config=./bunfig.toml, scripts/runWithCpuProfile.ts]
    volumes: [balance-state:/app/apps/balance-worker/.state]
    depends_on: [autumn]
  workers:
    <<: *runtime
    network_mode: service:autumn
    command: [bun, src/workers.ts]
    depends_on: [autumn]
networks:
  core:
    external: true
    name: omnidome_default
volumes:
  postgres:
  cache:
  kafka:
  dynamodb:
  balance-state:
