# Local dev overlay — iterate on sales + marketing without burning Railway usage.
#
# Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.override.yml up --build db sales marketing
#
# What this gives you:
#   - Postgres (port 5432) seeded from config/master_schema.sql on first boot
#   - Sales service (port 8002) with source bind-mounted + --reload (no rebuild loop)
#   - Marketing service (port 8014) with source bind-mounted + --reload
#   - External bridges BLANKED -> bridge helpers skip silently, so close-won,
#     webhooks and ticket escalation work fully offline
#   - License enforcement + auto-create tables forced on (matches Railway)
#
# Everything else in docker-compose.yaml stays untouched — other services only
# start if you name them explicitly.

services:
  db:
    ports:
      - "5432:5432"

  # Local web build needs the NEXT_PUBLIC_* baked in at build time. The Dockerfile
  # takes them as build args (Railway passes service vars as --build-arg); locally
  # we source them from the gitignored root .env so `docker compose build web` works
  # without them, next build fail-fasts in lib/supabase/client while prerendering.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8000}

  sales:
    build:
      context: .
      dockerfile: services/sales/Dockerfile
    command: >
      sh -c "uvicorn services.sales.main:app --host 0.0.0.0 --port 8002 --reload"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - LICENSE_ENFORCEMENT=warn
      - AUTO_CREATE_TABLES=true
      # External bridges deliberately BLANKED (offline dev — base .env would
      # otherwise inject localhost URLs that fail slowly instead of skipping).
      - LIFECYCLE_SERVICE_URL=
      - FINANCE_SERVICE_URL=
      - BILLING_WEBHOOK_URL=
      - NETWORK_WEBHOOK_URL=
      - SALES_PROVISIONING_WEBHOOKS=
      - AUTH_ALLOW_ANONYMOUS=true
    volumes:
      # Hot reload: no rebuild after each edit.
      - ./services/sales:/app/services/sales:ro
      - ./services/common:/app/services/common:ro
    depends_on:
      db:
        condition: service_healthy

  marketing:
    build:
      context: .
      dockerfile: services/marketing/Dockerfile
    command: >
      sh -c "uvicorn services.marketing.main:app --host 0.0.0.0 --port 8014 --reload"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - LICENSE_ENFORCEMENT=warn
      - AUTO_CREATE_TABLES=true
      # Zernio pulled from the gitignored root .env (empty there = offline dev,
      # lazy client returns None). Never hardcode the key in this tracked file.
      - ZERNIO_API_KEY=${ZERNIO_API_KEY:-}
      - ZERNIO_WEBHOOK_SECRET=${ZERNIO_WEBHOOK_SECRET:-}
      - ZERNIO_PROFILE_ID=${ZERNIO_PROFILE_ID:-}
      # AgentMail (outbound email via api.agentmail.to). Key from the gitignored
      # root .env / host env; empty = /email/send returns 503 (no silent stub).
      - AGENTMAIL_API_KEY=${AGENTMAIL_API_KEY:-}
      - AGENTMAIL_INBOX=${AGENTMAIL_INBOX:-omnidome@agentmail.to}
      - SUPPORT_SERVICE_URL=
      - SOCIAL_TICKET_CUSTOMER_ID=
      - AUTH_ALLOW_ANONYMOUS=true
    ports:
      - "8014:8014"
    volumes:
      # Hot reload: no rebuild after each edit.
      - ./services/marketing:/app/services/marketing:ro
      - ./services/common:/app/services/common:ro
    depends_on:
      db:
        condition: service_healthy

  # Analytics sync worker (dev). Idle until ZERNIO_API_KEY + ZERNIO_PROFILE_ID
  # are set. SEED_TENANT_ID (optional) maps one tenant to the profile so a
  # single-profile dev setup starts syncing without calling the API by hand.
  analytics_worker:
    build:
      context: .
      dockerfile: services/analytics_worker/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - LICENSE_ENFORCEMENT=warn
      # From the gitignored root .env (empty = worker idles). Never hardcode here.
      - ZERNIO_API_KEY=${ZERNIO_API_KEY:-}
      - ZERNIO_PROFILE_ID=${ZERNIO_PROFILE_ID:-}
      - SEED_TENANT_ID=${SEED_TENANT_ID:-}
      - LOG_LEVEL=INFO
    volumes:
      - ./services/analytics_worker:/app/services/analytics_worker:ro
      - ./services/marketing:/app/services/marketing:ro
      - ./services/common:/app/services/common:ro
    depends_on:
      db:
        condition: service_healthy
