[global]
type=global
user_agent=OmniDome-PBX
max_forwards=70
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
$NAT_LINES

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
$NAT_LINES

; WebRTC agents: SIP over WebSocket is served by the http server (http.conf) at /ws.
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
$NAT_LINES

$TLS_TRANSPORT

#include "generated/pjsip_*.conf"
