# Local always-on overlay.
#
# HARDWARE CONSTRAINT (found 2026-09-22): this host's CPU is an Intel N150 —
# 4 logical processors total, 3 given to WSL. Starting many Python/FastAPI
# containers + Next.js + Postgres AT ONCE saturates all 3 vCPUs instantly.
# Under that starvation WSL2's VM heartbeat times out and Windows resets the
# VM/dockerd — which then restarts every `restart: unless-stopped` container
# simultaneously again, recreating the same burst. That was a self-reinforcing
# crash loop, not a random flake.
#
# Fix: restart: unless-stopped stays ONLY on `db` (cheap, others need it ready
# first). Every other service is `restart: "no"` here — after a dockerd/VM
# restart they do NOT all slam back on at once. Instead `scripts/start-local.sh`
# (wired to run automatically via a systemd unit, PartOf=docker.service) brings
# them up ONE AT A TIME with a delay between each, spreading the CPU burst out
# instead of stacking it. See scripts/start-local.sh and
# /etc/systemd/system/omnidome-stagger.service inside the WSL distro.
#
# Manual use (auto-loads docker-compose.yaml + docker-compose.override.yml too):
#   export COMPOSE_FILE=docker-compose.yaml:docker-compose.override.yml:docker-compose.local.yml
#   bash scripts/start-local.sh          # staggered (preferred)
#   docker compose up -d --no-deps <services>   # parallel (only for 1-2 services)
services:
  db:
    restart: unless-stopped
  crm:
    restart: "no"
  sales:
    restart: "no"
    command: sh -c "uvicorn services.sales.main:app --host 0.0.0.0 --port 8002 --workers 1"
  billing:
    restart: "no"
    command: sh -c "uvicorn services.billing.main:app --host 0.0.0.0 --port 8003 --workers 1"
  finance:
    restart: "no"
    command: sh -c "uvicorn services.finance.main:app --host 0.0.0.0 --port 8015 --workers 1"
  inventory:
    restart: "no"
    command: sh -c "uvicorn services.inventory.main:app --host 0.0.0.0 --port 8010 --workers 1"
  rica:
    restart: "no"
  network:
    restart: "no"
    # In-process state: single worker only.
    command: sh -c "uvicorn services.network.main:app --host 0.0.0.0 --port 8005 --workers 1"
  iot:
    restart: "no"
  call_center:
    restart: "no"
    # In-process websocket registry: single worker only.
    command: sh -c "uvicorn services.call_center.main:app --host 0.0.0.0 --port 8007 --workers 1"
  support:
    restart: "no"
    # SSE job dispatch (_active_streams) is in-process: with --workers 2 half the technicians miss pushed jobs.
    command: sh -c "uvicorn services.support.main:app --host 0.0.0.0 --port 8008 --workers 1"
  retention:
    restart: "no"
  compliance:
    restart: "no"
    # The Dockerfile CMD hard-codes `--workers 2`; each extra worker is a full Python process
    # (this service imports pymupdf/docx/trafilatura), so run ONE worker on this CPU/RAM-starved host.
    command: sh -c "uvicorn services.compliance.main:app --host 0.0.0.0 --port 8019 --workers 1"
  marketing:
    restart: "no"
    command: sh -c "uvicorn services.marketing.main:app --host 0.0.0.0 --port 8014 --workers 1"
  admin:
    restart: "no"
    command: sh -c "uvicorn services.admin.main:app --host 0.0.0.0 --port 8013 --workers 1"
  hr:
    restart: "no"
    command: sh -c "uvicorn services.hr.main:app --host 0.0.0.0 --port 8009 --workers 1"
  tenant_memory:
    restart: "no"
    command: sh -c "uvicorn services.tenant_memory.main:app --host 0.0.0.0 --port 8025 --workers 1"
  fno_intelligence:
    restart: "no"
    command: sh -c "uvicorn services.fno_intelligence.main:app --host 0.0.0.0 --port 8024 --workers 1"
  gateway:
    restart: "no"
    command: sh -c "uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000 --workers 1"
  journey_engine:
    restart: "no"
  web_analytics:
    restart: "no"
  lifecycle:
    restart: "no"
  web:
    restart: "no"
  portal:
    restart: "no"
  agent-orchestrator:
    restart: "no"
  presenton:
    restart: "no"
