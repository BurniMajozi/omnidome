version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/master_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5



  crm:
    build:
      context: .
      dockerfile: services/crm/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8001:8001"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  sales:
    build:
      context: .
      dockerfile: services/sales/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
