version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/master_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5



  crm:
    build:
      context: .
      dockerfile: services/crm/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  sales:
    build:
      context: .
      dockerfile: services/sales/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    env_file:
      - .env
    environment:
      - UVICORN_ACCESS_LOG=false
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  finance:
    build:
      context: .
      dockerfile: services/finance/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8015:8015"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  rica:
    build:
      context: .
      dockerfile: services/rica/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - SMILE_ID_PARTNER_ID=${SMILE_ID_PARTNER_ID}
      - SMILE_ID_API_KEY=${SMILE_ID_API_KEY}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  network:
    build:
      context: .
      dockerfile: services/network/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - VUMATEL_API_URL=${VUMATEL_API_URL:-http://vumatel-mock:9001}
      - VUMATEL_API_KEY=${VUMATEL_API_KEY:-}
      - OPENSERVE_API_URL=${OPENSERVE_API_URL:-http://openserve-mock:9002}
      - OPENSERVE_API_KEY=${OPENSERVE_API_KEY:-}
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  iot:
    build:
      context: .
      dockerfile: services/iot/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - IOT_TOKEN_ENCRYPTION_KEY=${IOT_TOKEN_ENCRYPTION_KEY:-}
      - IOT_ENFORCE_ROLES=${IOT_ENFORCE_ROLES:-true}
      - IOT_ALLOW_HTTP=${IOT_ALLOW_HTTP:-false}
      - IOT_ALLOW_PRIVATE_HA=${IOT_ALLOW_PRIVATE_HA:-false}
    ports:
      - "127.0.0.1:8006:8006"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  call_center:
    build:
      context: .
      dockerfile: services/call_center/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - VOICEBOX_SERVICE_URL=${VOICEBOX_SERVICE_URL:-http://voicebox:8027}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      # Telephony (Asterisk). Inactive unless ASTERISK_ARI_PASSWORD is set; see docs/call-center-telephony.md
      - ASTERISK_ARI_URL=${ASTERISK_ARI_URL:-http://asterisk:8088}
      - ASTERISK_ARI_USER=${ASTERISK_ARI_USER:-omnidome}
      - ASTERISK_ARI_PASSWORD=${ASTERISK_ARI_PASSWORD:-}
      - ASTERISK_ARI_APP=${ASTERISK_ARI_APP:-omnidome}
      - ASTERISK_ADMIN_URL=${ASTERISK_ADMIN_URL:-http://asterisk:8099}
      - ASTERISK_ADMIN_TOKEN=${ASTERISK_ADMIN_TOKEN:-}
      - TELEPHONY_WSS_URL=${TELEPHONY_WSS_URL:-}
      - TELEPHONY_SIP_DOMAIN=${TELEPHONY_SIP_DOMAIN:-}
      - TELEPHONY_STUN_URLS=${TELEPHONY_STUN_URLS:-stun:stun.l.google.com:19302}
      - TELEPHONY_TURN_URL=${TELEPHONY_TURN_URL:-}
      - TELEPHONY_TURN_USERNAME=${TELEPHONY_TURN_USERNAME:-}
      - TELEPHONY_TURN_CREDENTIAL=${TELEPHONY_TURN_CREDENTIAL:-}
      - TELEPHONY_AUTO_TRANSCRIBE=${TELEPHONY_AUTO_TRANSCRIBE:-false}
    ports:
      - "127.0.0.1:8007:8007"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro
      - asterisk_generated:/asterisk-generated
      - asterisk_recordings:/asterisk-recordings:ro

  # Asterisk PBX for the Call Center. OPT-IN: `docker compose --profile telephony up -d asterisk`.
  # Publishes NOTHING to the host: ARI/WebSocket (8088) and the admin sidecar (8099) are reachable only
  # from other containers on this compose network. Public SIP/RTP publishing is a VPS-only step, see
  # docs/call-center-telephony.md. Refuses to start without ASTERISK_ARI_PASSWORD / ASTERISK_ADMIN_TOKEN.
  asterisk:
    build:
      context: services/asterisk
    profiles: ["telephony"]
    environment:
      - ASTERISK_ARI_USER=${ASTERISK_ARI_USER:-omnidome}
      - ASTERISK_ARI_PASSWORD=${ASTERISK_ARI_PASSWORD:-}
      - ASTERISK_ARI_APP=${ASTERISK_ARI_APP:-omnidome}
      - ASTERISK_ADMIN_TOKEN=${ASTERISK_ADMIN_TOKEN:-}
      - ASTERISK_RTP_START=${ASTERISK_RTP_START:-10000}
      - ASTERISK_RTP_END=${ASTERISK_RTP_END:-10100}
      - ASTERISK_EXTERNAL_IP=${ASTERISK_EXTERNAL_IP:-}
      - ASTERISK_LOCAL_NET=${ASTERISK_LOCAL_NET:-}
      - ASTERISK_STUN_SERVER=${ASTERISK_STUN_SERVER:-stun.l.google.com:19302}
    volumes:
      - asterisk_generated:/etc/asterisk/generated:ro
      - asterisk_recordings:/var/spool/asterisk/recording
    restart: unless-stopped

  support:
    build:
      context: .
      dockerfile: services/support/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8008:8008"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  hr:
    build:
      context: .
      dockerfile: services/hr/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8009:8009"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  communication:
    build:
      context: .
      dockerfile: services/communication/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8020:8020"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  # ── Voicebox: tenant-aware voice cloning/personalities/TTS/STT adapter ──
  # Lightweight (no PyTorch) — talks to the heavy `voicebox-engine` below
  # over HTTP. Starts normally with the rest of the stack; calls against
  # it 503 cleanly with a clear message until voicebox-engine is running.
  voicebox:
    build:
      context: .
      dockerfile: services/voicebox/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - VOICEBOX_ENGINE_URL=${VOICEBOX_ENGINE_URL:-http://voicebox-engine:17493}
    ports:
      - "127.0.0.1:8027:8027"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  # Heavy local ML engine (PyTorch + several TTS engines + Whisper),
  # vendored from https://github.com/jamiepine/voicebox (MIT) into
  # services/voicebox/engine. NOT started by `docker compose up` — the
  # `profiles` key below excludes it from the default run. Bring it up
  # explicitly once you've confirmed GPU/disk budget:
  #   docker compose --profile voicebox-engine up -d voicebox-engine
  # First run downloads multi-GB model weights into the voicebox_models
  # volume (set VOICEBOX_MODELS_DIR inside the container if you want a
  # different layout).
  voicebox-engine:
    profiles: ["voicebox-engine"]
    build:
      context: services/voicebox/engine
      dockerfile: Dockerfile
    environment:
      - VOICEBOX_MODELS_DIR=/data/models
    ports:
      - "127.0.0.1:17493:17493"
    volumes:
      - voicebox_models:/data/models
      # Engine's own SQLite db (profiles/generations) + generated audio +
      # uploaded cloning samples — without this, recreating the container
      # silently wipes every voice profile even though our Postgres
      # metadata (services/voicebox) still references them.
      - voicebox_data:/app/data
    restart: unless-stopped

  agent-orchestrator:
    build:
      context: .
      dockerfile: services/agent_orchestrator/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free}
      - OPENROUTER_FALLBACK_MODELS=${OPENROUTER_FALLBACK_MODELS:-nvidia/nemotron-3-super-120b-a12b:free,liquid/lfm-2.5-2.6b:free,qwen/qwen3.8-27b:free}
      - AGENT_ORCHESTRATOR_ENABLE_TELEGRAM=false
      - VOICEBOX_SERVICE_URL=${VOICEBOX_SERVICE_URL:-http://voicebox:8027}
      - SIM_API_URL=${SIM_API_URL:-}
      - SIM_API_KEY=${SIM_API_KEY:-}
    ports:
      - "127.0.0.1:8021:8021"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  compliance:
    build:
      context: .
      dockerfile: services/compliance/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "127.0.0.1:8019:8019"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  tenant_memory:
    build:
      context: .
      dockerfile: services/tenant_memory/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # Knowledge layer (optional; empty KNOWLEDGE_DB_URL = disabled, recall stays keyword-only)
      - KNOWLEDGE_DB_URL=${KNOWLEDGE_DB_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - OLLAMA_BASE_URL=${KNOWLEDGE_OLLAMA_URL:-http://ollama:11434}
    ports:
      - "127.0.0.1:8025:8025"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  # ── Knowledge layer (profile "knowledge": not started by a plain `docker compose up`) ──
  # Derived, rebuildable vector store. No published ports: reachable only on the compose network.
  # POSTGRES_PASSWORD empty => the postgres image refuses to initialise (fail closed).
  knowledge_db:
    image: pgvector/pgvector:pg16
    profiles: ["knowledge"]
    restart: unless-stopped
    environment:
      - POSTGRES_DB=knowledge
      - POSTGRES_USER=knowledge_owner
      - POSTGRES_PASSWORD=${KNOWLEDGE_DB_PASSWORD:-}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "maintenance_work_mem=128MB", "-c", "max_connections=30"]
    volumes:
      - knowledge_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_owner -d knowledge"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M

  # One worker (same image as tenant_memory): migrations, incremental indexing, reconcile, consolidation.
  knowledge_indexer:
    build:
      context: .
      dockerfile: services/tenant_memory/Dockerfile
    profiles: ["knowledge"]
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "services.tenant_memory.knowledge.worker"]
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - DATABASE_URL=${DATABASE_URL}
      - KNOWLEDGE_DB_URL=${KNOWLEDGE_DB_URL:-}
      - KNOWLEDGE_DB_ADMIN_URL=${KNOWLEDGE_DB_ADMIN_URL:-}
      - KNOWLEDGE_APP_PASSWORD=${KNOWLEDGE_APP_PASSWORD:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - OLLAMA_BASE_URL=${KNOWLEDGE_OLLAMA_URL:-http://ollama:11434}
      - INDEX_BATCH_SIZE=${INDEX_BATCH_SIZE:-50}
      - INDEX_CONCURRENCY=${INDEX_CONCURRENCY:-1}
      - INDEX_SLEEP_S=${INDEX_SLEEP_S:-1.0}
    depends_on:
      - db
      - knowledge_db
      - ollama
    deploy:
      resources:
        limits:
          memory: 384M

  portal-builder:
    build:
      context: .
      dockerfile: services/portal_builder/Dockerfile
    env_file:
      - .env
    environment:
      - UVICORN_ACCESS_LOG=false
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "127.0.0.1:8026:8026"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  retention:
    build:
      context: .
      dockerfile: services/retention/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - ML_MODEL_PATH=${ML_MODEL_PATH}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8012:8012"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  marketing:
    build:
      context: .
      dockerfile: services/marketing/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8014:8014"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  # Background worker: keeps each tenant's analytics tables fresh from Zernio.
  # No HTTP port — driven by an internal scheduler (hot hourly, long-tail
  # weekly, followers daily). Dashboards read the DB, never Zernio.
  analytics_worker:
    build:
      context: .
      dockerfile: services/analytics_worker/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8013:8013"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - ADMIN_SERVICE_URL=${ADMIN_SERVICE_URL:-http://admin:8013}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL}
      - COMPLIANCE_SERVICE_URL=${COMPLIANCE_SERVICE_URL:-http://compliance:8019}
      - TENANT_MEMORY_SERVICE_URL=${TENANT_MEMORY_SERVICE_URL:-http://tenant_memory:8025}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://agent-orchestrator:8021}
      - ADMIN_SERVICE_URL=${ADMIN_SERVICE_URL:-http://admin:8013}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      # *_SERVICE_URL for next.config.mjs's /svc/* rewrites (Docker hostnames —
      # these all previously fell back to a hardcoded "localhost:PORT" in
      # next.config.mjs, which only resolves when this Next.js process runs on
      # the host, not inside this container. Found 2026-06-30: this silently
      # broke call-center, communication's voice add-ons, and webchat's own
      # COMMUNICATION_SERVICE_URL-dependent /api/chat/* routes.)
      - SALES_SERVICE_URL=${SALES_SERVICE_URL:-http://sales:8002}
      - RICA_SERVICE_URL=${RICA_SERVICE_URL:-http://rica:8004}
      - NETWORK_SERVICE_URL=${NETWORK_SERVICE_URL:-http://network:8005}
      - IOT_SERVICE_URL=${IOT_SERVICE_URL:-http://iot:8006}
      - CALL_CENTER_SERVICE_URL=${CALL_CENTER_SERVICE_URL:-http://call_center:8007}
      - SUPPORT_SERVICE_URL=${SUPPORT_SERVICE_URL:-http://support:8008}
      - HR_SERVICE_URL=${HR_SERVICE_URL:-http://hr:8009}
      - RETENTION_SERVICE_URL=${RETENTION_SERVICE_URL:-http://retention:8012}
      - COMMUNICATION_SERVICE_URL=${COMMUNICATION_SERVICE_URL:-http://communication:8020}
      - WEB_ANALYTICS_SERVICE_URL=${WEB_ANALYTICS_SERVICE_URL:-http://web_analytics:8016}
      - CUSTOMER_JOURNEY_SERVICE_URL=${CUSTOMER_JOURNEY_SERVICE_URL:-http://customer_journey:8022}
      - BILLING_COLLECTIONS_SERVICE_URL=${BILLING_COLLECTIONS_SERVICE_URL:-http://billing_collections:8023}
      - FNO_INTELLIGENCE_SERVICE_URL=${FNO_INTELLIGENCE_SERVICE_URL:-http://fno_intelligence:8024}
      - VOICEBOX_SERVICE_URL=${VOICEBOX_SERVICE_URL:-http://voicebox:8027}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - crm
      - sales
      - billing
      - finance
      - rica
      - network
      - compliance
      - tenant_memory
      - gateway
      - agent-orchestrator

  portal:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./apps/portal:/usr/share/nginx/html/portal:ro
      - ./brand_guidelines:/usr/share/nginx/html/brand_guidelines:ro
    # Scoped read-only mounts: portal fetches theme from ../brand_guidelines.
    # NEVER mount repo root here - it exposes .env/.git/source over HTTP.

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "gemma3:4b"]
    restart: "no"

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    depends_on:
      - ollama
    volumes:
      - ./hermes_data:/opt/data
      - ..:/opt/data/workspace
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - OBSIDIAN_VAULT_PATH=/opt/data/workspace/omnidome/Hermes-Obsidian
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${HERMES_API_KEY}
      - API_SERVER_HOST=0.0.0.0

  # ── Journey Engine Service ─────────────────────────────────────────
  journey_engine:
    build:
      context: .
      dockerfile: services/journey_engine/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - MODULE_ID=journey_engine
    ports:
      - "127.0.0.1:8017:8017"
    depends_on:
      - db
    volumes:
      - ./services/journey_engine:/app/services/journey_engine:ro
      - ./services/common:/app/services/common:ro
    restart: unless-stopped
# Web Analytics Service — Docker Compose additions
# Append these to the services section of docker-compose.yaml

  # ── Web Analytics Service ──────────────────────────────────────────
  web_analytics:
    build:
      context: .
      dockerfile: services/web_analytics/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - ANALYTICS_IP_SALT=omnidome-web-analytics-${POSTGRES_DB}
    ports:
      - "127.0.0.1:8016:8016"
    depends_on:
      - db
    volumes:
      - ./services/web_analytics:/app/services/web_analytics:ro
      - ./services/common:/app/services/common:ro
    restart: unless-stopped

  lifecycle:
    build:
      context: .
      dockerfile: services/lifecycle/Dockerfile
    # No env_file: lifecycle gets only what services/lifecycle + services/common (auth, db, entitlements,
    # license, middleware) read. Deliberately NOT passed: INVITE_CODE_SECRET, provider/API keys, Supabase keys.
    ports:
      - "127.0.0.1:8018:8018"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LIFECYCLE_SERVICE_URL=http://lifecycle:8018
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - AUTH_JWT_VERIFY=${AUTH_JWT_VERIFY:-true}
      - AUTH_JWT_ALGORITHM=${AUTH_JWT_ALGORITHM:-HS256}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-}
      - AUTH_JWT_PUBLIC_KEY=${AUTH_JWT_PUBLIC_KEY:-}
      - AUTH_ALLOW_ANONYMOUS=${AUTH_ALLOW_ANONYMOUS:-false}
      - AUTH_DB_ENFORCE=${AUTH_DB_ENFORCE:-true}
      - AUTH_ENFORCE_MODULES=${AUTH_ENFORCE_MODULES:-true}
      - AUTH_ENFORCE_RBAC=${AUTH_ENFORCE_RBAC:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - LICENSE_PATH=${LICENSE_PATH:-}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY:-}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT:-warn}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  customer_journey:
    build:
      context: .
      dockerfile: services/customer_journey/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8022:8022"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  billing_collections:
    build:
      context: .
      dockerfile: services/billing_collections/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "127.0.0.1:8023:8023"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  fno_intelligence:
    build:
      context: .
      dockerfile: services/fno_intelligence/Dockerfile
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      # Governed-metric snapshots are written as metric facts through tenant_memory (deterministic path, metrics.write).
      - TENANT_MEMORY_SERVICE_URL=${TENANT_MEMORY_SERVICE_URL:-http://tenant_memory:8025}
      - BI_METRICS_SNAPSHOT_ENABLED=${BI_METRICS_SNAPSHOT_ENABLED:-true}
    ports:
      - "127.0.0.1:8024:8024"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Forecast batch job (profile "forecast": never started by `docker compose up`) ──
  # One-shot, no ports, no always-on API:  docker compose --profile forecast run --rm forecaster
  # Reads ACTUAL metric facts, writes FORECAST facts through tenant_memory. Chronos is used only if its weights are on the
  # `forecast_models` volume (pull once, see docs/forecasting.md); otherwise numpy baselines run (no torch needed).
  forecaster:
    build:
      context: .
      dockerfile: services/forecaster/Dockerfile
    profiles: ["forecast"]
    restart: "no"
    env_file:
      - .env
    environment:
      - AUTH_MODE=${AUTH_MODE:-signed}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - TENANT_MEMORY_SERVICE_URL=${TENANT_MEMORY_SERVICE_URL:-http://tenant_memory:8025}
      - FORECAST_MODEL_DIR=/models
      - FORECAST_CHRONOS=${FORECAST_CHRONOS:-auto}
      - FORECAST_CHRONOS_MODEL=${FORECAST_CHRONOS_MODEL:-chronos-bolt-small}
    volumes:
      - forecast_models:/models
    depends_on:
      db:
        condition: service_healthy
      tenant_memory:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1536M

volumes:
  postgres_data:
  knowledge_data:
  forecast_models:
  ollama_data:
  voicebox_models:
  voicebox_data:
  asterisk_generated:
  asterisk_recordings:
