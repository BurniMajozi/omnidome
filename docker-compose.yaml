version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/master_schema.sql:/docker-entrypoint-initdb.d/init.sql

  crm:
    build:
      context: .
      dockerfile: services/crm/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8001:8001"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  sales:
    build:
      context: .
      dockerfile: services/sales/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8002:8002"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8003:8003"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  finance:
    build:
      context: .
      dockerfile: services/finance/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8015:8015"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  rica:
    build:
      context: .
      dockerfile: services/rica/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SMILE_ID_PARTNER_ID=${SMILE_ID_PARTNER_ID}
      - SMILE_ID_API_KEY=${SMILE_ID_API_KEY}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8004:8004"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  network:
    build:
      context: .
      dockerfile: services/network/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - VUMATEL_API_URL=${VUMATEL_API_URL:-http://vumatel-mock:9001}
      - VUMATEL_API_KEY=${VUMATEL_API_KEY:-}
      - OPENSERVE_API_URL=${OPENSERVE_API_URL:-http://openserve-mock:9002}
      - OPENSERVE_API_KEY=${OPENSERVE_API_KEY:-}
    ports:
      - "8005:8005"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  iot:
    build:
      context: .
      dockerfile: services/iot/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8006:8006"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  call_center:
    build:
      context: .
      dockerfile: services/call_center/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8007:8007"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  retention:
    build:
      context: .
      dockerfile: services/retention/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ML_MODEL_PATH=${ML_MODEL_PATH}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8012:8012"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  marketing:
    build:
      context: .
      dockerfile: services/marketing/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8014:8014"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8013:8013"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file:
      - .env
    environment:
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - ADMIN_SERVICE_URL=${ADMIN_SERVICE_URL:-http://admin:8013}
    ports:
      - "8000:8000"
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL}
    ports:
      - "3000:3000"
    depends_on:
      - crm
      - sales
      - billing
      - finance
      - rica
      - network
      - gateway

  portal:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./apps/portal:/usr/share/nginx/html/portal
    # Note: We mount root so portal can fetch theme from ../brand_guidelines

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    volumes:
      - ./hermes_data:/opt/data
      - ..:/opt/data/workspace
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}

  # ── Journey Engine Service ─────────────────────────────────────────
  journey_engine:
    build:
      context: .
      dockerfile: services/journey_engine/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MODULE_ID=journey_engine
    ports:
      - "8017:8017"
    depends_on:
      - db
    volumes:
      - ./services/journey_engine:/app/services/journey_engine:ro
      - ./services/common:/app/services/common:ro
    restart: unless-stopped
# Web Analytics Service — Docker Compose additions
# Append these to the services section of docker-compose.yaml

  # ── Web Analytics Service ──────────────────────────────────────────
  web_analytics:
    build:
      context: .
      dockerfile: services/web_analytics/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ANALYTICS_IP_SALT=omnidome-web-analytics-${POSTGRES_DB}
    ports:
      - "8016:8016"
    depends_on:
      - db
    volumes:
      - ./services/web_analytics:/app/services/web_analytics:ro
      - ./services/common:/app/services/common:ro
    restart: unless-stopped

  lifecycle:
    build:
      context: .
      dockerfile: services/lifecycle/Dockerfile
    ports:
      - "8018:8018"
    environment:
      - DATABASE_URL=postgresql+asyncpg://omnidome:omnidome@db:5432/omnidome
      - LIFECYCLE_SERVICE_URL=http://lifecycle:8018
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data:
