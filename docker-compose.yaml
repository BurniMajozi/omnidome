version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/master_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5



  crm:
    build:
      context: .
      dockerfile: services/crm/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8001:8001"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  sales:
    build:
      context: .
      dockerfile: services/sales/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8002:8002"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8003:8003"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  finance:
    build:
      context: .
      dockerfile: services/finance/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8015:8015"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  rica:
    build:
      context: .
      dockerfile: services/rica/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SMILE_ID_PARTNER_ID=${SMILE_ID_PARTNER_ID}
      - SMILE_ID_API_KEY=${SMILE_ID_API_KEY}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8004:8004"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  network:
    build:
      context: .
      dockerfile: services/network/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - VUMATEL_API_URL=${VUMATEL_API_URL:-http://vumatel-mock:9001}
      - VUMATEL_API_KEY=${VUMATEL_API_KEY:-}
      - OPENSERVE_API_URL=${OPENSERVE_API_URL:-http://openserve-mock:9002}
      - OPENSERVE_API_KEY=${OPENSERVE_API_KEY:-}
    ports:
      - "8005:8005"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  iot:
    build:
      context: .
      dockerfile: services/iot/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8006:8006"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  call_center:
    build:
      context: .
      dockerfile: services/call_center/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - VOICEBOX_SERVICE_URL=${VOICEBOX_SERVICE_URL:-http://voicebox:8027}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
    ports:
      - "8007:8007"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  support:
    build:
      context: .
      dockerfile: services/support/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8008:8008"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  hr:
    build:
      context: .
      dockerfile: services/hr/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8009:8009"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8010:8010"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  communication:
    build:
      context: .
      dockerfile: services/communication/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8020:8020"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  # ── Voicebox: tenant-aware voice cloning/personalities/TTS/STT adapter ──
  # Lightweight (no PyTorch) — talks to the heavy `voicebox-engine` below
  # over HTTP. Starts normally with the rest of the stack; calls against
  # it 503 cleanly with a clear message until voicebox-engine is running.
  voicebox:
    build:
      context: .
      dockerfile: services/voicebox/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - VOICEBOX_ENGINE_URL=${VOICEBOX_ENGINE_URL:-http://voicebox-engine:17493}
    ports:
      - "8027:8027"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  # Heavy local ML engine (PyTorch + several TTS engines + Whisper),
  # vendored from https://github.com/jamiepine/voicebox (MIT) into
  # services/voicebox/engine. NOT started by `docker compose up` — the
  # `profiles` key below excludes it from the default run. Bring it up
  # explicitly once you've confirmed GPU/disk budget:
  #   docker compose --profile voicebox-engine up -d voicebox-engine
  # First run downloads multi-GB model weights into the voicebox_models
  # volume (set VOICEBOX_MODELS_DIR inside the container if you want a
  # different layout).
  voicebox-engine:
    profiles: ["voicebox-engine"]
    build:
      context: services/voicebox/engine
      dockerfile: Dockerfile
    environment:
      - VOICEBOX_MODELS_DIR=/data/models
    ports:
      - "17493:17493"
    volumes:
      - voicebox_models:/data/models
      # Engine's own SQLite db (profiles/generations) + generated audio +
      # uploaded cloning samples — without this, recreating the container
      # silently wipes every voice profile even though our Postgres
      # metadata (services/voicebox) still references them.
      - voicebox_data:/app/data
    restart: unless-stopped

  agent-orchestrator:
    build:
      context: .
      dockerfile: services/agent_orchestrator/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AGENT_ORCHESTRATOR_ENABLE_TELEGRAM=false
      - VOICEBOX_SERVICE_URL=${VOICEBOX_SERVICE_URL:-http://voicebox:8027}
    ports:
      - "8021:8021"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  compliance:
    build:
      context: .
      dockerfile: services/compliance/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "8019:8019"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  tenant_memory:
    build:
      context: .
      dockerfile: services/tenant_memory/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "8025:8025"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  portal-builder:
    build:
      context: .
      dockerfile: services/portal_builder/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "8026:8026"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  retention:
    build:
      context: .
      dockerfile: services/retention/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ML_MODEL_PATH=${ML_MODEL_PATH}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8012:8012"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  marketing:
    build:
      context: .
      dockerfile: services/marketing/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8014:8014"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8013:8013"
    depends_on:
      - db
    volumes:
      - ./licenses/license.json:/etc/coreconnect/license.json:ro

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file:
      - .env
    environment:
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
      - ADMIN_SERVICE_URL=${ADMIN_SERVICE_URL:-http://admin:8013}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=${NEXT_PUBLIC_GATEWAY_URL}
      - COMPLIANCE_SERVICE_URL=${COMPLIANCE_SERVICE_URL:-http://compliance:8019}
      - TENANT_MEMORY_SERVICE_URL=${TENANT_MEMORY_SERVICE_URL:-http://tenant_memory:8025}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://agent-orchestrator:8021}
      - ADMIN_SERVICE_URL=${ADMIN_SERVICE_URL:-http://admin:8013}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
      # *_SERVICE_URL for next.config.mjs's /svc/* rewrites (Docker hostnames —
      # these all previously fell back to a hardcoded "localhost:PORT" in
      # next.config.mjs, which only resolves when this Next.js process runs on
      # the host, not inside this container. Found 2026-06-30: this silently
      # broke call-center, communication's voice add-ons, and webchat's own
      # COMMUNICATION_SERVICE_URL-dependent /api/chat/* routes.)
      - SALES_SERVICE_URL=${SALES_SERVICE_URL:-http://sales:8002}
      - RICA_SERVICE_URL=${RICA_SERVICE_URL:-http://rica:8004}
      - NETWORK_SERVICE_URL=${NETWORK_SERVICE_URL:-http://network:8005}
      - IOT_SERVICE_URL=${IOT_SERVICE_URL:-http://iot:8006}
      - CALL_CENTER_SERVICE_URL=${CALL_CENTER_SERVICE_URL:-http://call_center:8007}
      - SUPPORT_SERVICE_URL=${SUPPORT_SERVICE_URL:-http://support:8008}
      - HR_SERVICE_URL=${HR_SERVICE_URL:-http://hr:8009}
      - RETENTION_SERVICE_URL=${RETENTION_SERVICE_URL:-http://retention:8012}
      - COMMUNICATION_SERVICE_URL=${COMMUNICATION_SERVICE_URL:-http://communication:8020}
      - WEB_ANALYTICS_SERVICE_URL=${WEB_ANALYTICS_SERVICE_URL:-http://web_analytics:8016}
      - CUSTOMER_JOURNEY_SERVICE_URL=${CUSTOMER_JOURNEY_SERVICE_URL:-http://customer_journey:8022}
      - BILLING_COLLECTIONS_SERVICE_URL=${BILLING_COLLECTIONS_SERVICE_URL:-http://billing_collections:8023}
      - FNO_INTELLIGENCE_SERVICE_URL=${FNO_INTELLIGENCE_SERVICE_URL:-http://fno_intelligence:8024}
      - VOICEBOX_SERVICE_URL=${VOICEBOX_SERVICE_URL:-http://voicebox:8027}
    ports:
      - "3000:3000"
    depends_on:
      - crm
      - sales
      - billing
      - finance
      - rica
      - network
      - compliance
      - tenant_memory
      - gateway
      - agent-orchestrator

  portal:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./apps/portal:/usr/share/nginx/html/portal:ro
      - ./brand_guidelines:/usr/share/nginx/html/brand_guidelines:ro
    # Scoped read-only mounts: portal fetches theme from ../brand_guidelines.
    # NEVER mount repo root here - it exposes .env/.git/source over HTTP.

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "gemma3:4b"]
    restart: "no"

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    command: gateway run
    depends_on:
      - ollama
    volumes:
      - ./hermes_data:/opt/data
      - ..:/opt/data/workspace
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - OBSIDIAN_VAULT_PATH=/opt/data/workspace/omnidome/Hermes-Obsidian
      - API_SERVER_ENABLED=true
      - API_SERVER_KEY=${HERMES_API_KEY}
      - API_SERVER_HOST=0.0.0.0

  # ── Journey Engine Service ─────────────────────────────────────────
  journey_engine:
    build:
      context: .
      dockerfile: services/journey_engine/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MODULE_ID=journey_engine
    ports:
      - "8017:8017"
    depends_on:
      - db
    volumes:
      - ./services/journey_engine:/app/services/journey_engine:ro
      - ./services/common:/app/services/common:ro
    restart: unless-stopped
# Web Analytics Service — Docker Compose additions
# Append these to the services section of docker-compose.yaml

  # ── Web Analytics Service ──────────────────────────────────────────
  web_analytics:
    build:
      context: .
      dockerfile: services/web_analytics/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ANALYTICS_IP_SALT=omnidome-web-analytics-${POSTGRES_DB}
    ports:
      - "8016:8016"
    depends_on:
      - db
    volumes:
      - ./services/web_analytics:/app/services/web_analytics:ro
      - ./services/common:/app/services/common:ro
    restart: unless-stopped

  lifecycle:
    build:
      context: .
      dockerfile: services/lifecycle/Dockerfile
    ports:
      - "8018:8018"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LIFECYCLE_SERVICE_URL=http://lifecycle:8018
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  customer_journey:
    build:
      context: .
      dockerfile: services/customer_journey/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8022:8022"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  billing_collections:
    build:
      context: .
      dockerfile: services/billing_collections/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8023:8023"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  fno_intelligence:
    build:
      context: .
      dockerfile: services/fno_intelligence/Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LICENSE_PATH=${LICENSE_PATH}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY}
      - LICENSE_ENFORCEMENT=${LICENSE_ENFORCEMENT}
    ports:
      - "8024:8024"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  voicebox_models:
  voicebox_data:
